<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص مسارات الدخول — §108</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background:#fff; color:#111; }
  h1 { font-size: 26px; margin: 8px 0 4px; }
  p.sub { font-size: 18px; color:#444; margin: 0 0 16px; }
  .row { border: 2px solid #ccc; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .name { font-size: 21px; font-weight: 700; margin-bottom: 6px; }
  .res { font-size: 19px; word-break: break-word; white-space: pre-wrap; }
  .ok { border-color: #1a7f37; }
  .ok .res { color: #1a7f37; }
  .bad { border-color: #b91c1c; }
  .bad .res { color: #b91c1c; }
  .wait .res { color: #666; }
  #summary { font-size: 22px; font-weight: 700; border: 3px solid #111; border-radius: 12px; padding: 14px; display:none; }
  button { font-size: 22px; padding: 14px 22px; border-radius: 12px; margin-top: 8px; }
</style>
</head>
<body>
<h1>فحص مسارات الدخول</h1>
<p class="sub">الفحص بيشتغل لوحده أول ما الصفحة تفتح. كل سطر = محاولة حقيقية من جهازك. الرقم المستخدم في الفحص وهمي ومقصود بيه يوصل لرد «رقم غير صحيح» — ده معناه إن المسار سليم ووصل للخادم فعلًا.</p>
<div id="rows"></div>
<div id="summary"></div>
<button onclick="location.reload()">إعادة الفحص</button>
<script>
var DIRECT = "https://million-branches-auth.vercel.app/api";
var tests = [
  { id: "v",  name: "١) نسخة التطبيق من نفس الموقع", run: function(){ return fetch("/app/version.json", {cache:"no-store"}); } },
  { id: "dg", name: "٢) قائمة المستخدمين — المسار العادي (وكيل الموقع)", run: function(){ return fetch("/app/authfn/directory", {cache:"no-store"}); } },
  { id: "sp", name: "٣) فحص الرقم السري — المسار العادي (وكيل الموقع)", run: function(){ return post("/app/authfn/session"); } },
  { id: "dd", name: "٤) قائمة المستخدمين — المسار المباشر (من غير وكيل)", run: function(){ return fetch(DIRECT + "/directory", {cache:"no-store"}); } },
  { id: "sd", name: "٥) فحص الرقم السري — المسار المباشر (من غير وكيل)", run: function(){ return post(DIRECT + "/session"); } }
];
function post(url){
  return fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({appUserId:"u-diag", pin:"000000"}) });
}
function rowEl(t){
  var d = document.createElement("div");
  d.className = "row wait"; d.id = "row-" + t.id;
  d.innerHTML = '<div class="name"></div><div class="res">جارٍ الفحص…</div>';
  d.querySelector(".name").textContent = t.name;
  document.getElementById("rows").appendChild(d);
  return d;
}
async function run(){
  var judged = { proxy:false, direct:false };
  for (var i=0;i<tests.length;i++){
    var t = tests[i], el = rowEl(t), res = el.querySelector(".res");
    var t0 = Date.now();
    try {
      var r = await t.run();
      var txt = await r.text();
      var ms = Date.now() - t0;
      res.textContent = "الخادم رد: HTTP " + r.status + " — " + txt.slice(0,140) + "  (" + ms + "ms)";
      var good = (t.id==="sp"||t.id==="sd") ? (r.status===401 && txt.indexOf("invalid")!==-1) : r.ok;
      el.className = "row " + (good ? "ok" : "bad");
      if (t.id==="sp" && good) judged.proxy = true;
      if (t.id==="sd" && good) judged.direct = true;
    } catch(e) {
      res.textContent = "فشل شبكة: الطلب ما وصلش للخادم أصلًا من جهازك (" + (e && e.message ? e.message : e) + ")";
      el.className = "row bad";
    }
  }
  var s = document.getElementById("summary");
  s.style.display = "block";
  s.textContent = "الخلاصة: المسار العادي " + (judged.proxy ? "شغال من جهازك ✓" : "مش واصل من جهازك ✗") +
                  " — المسار المباشر " + (judged.direct ? "شغال من جهازك ✓" : "مش واصل من جهازك ✗") +
                  " — الوقت: " + new Date().toLocaleString("ar-EG");
}
run();
</script>
</body>
</html>
