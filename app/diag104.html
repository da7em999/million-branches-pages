<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار اتصال الدخول — Million Branches</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0B1F3A; color:#fff; margin:0; padding:20px; }
  .card { background:#fff; color:#14202e; border-radius:16px; padding:20px; max-width:640px; margin:0 auto; }
  h1 { font-size:24px; margin:0 0 10px; }
  p { font-size:17px; line-height:1.7; }
  button { width:100%; font-size:22px; font-weight:800; padding:16px; border:0; border-radius:12px; background:#1d7a3a; color:#fff; }
  button:disabled { opacity:.5; }
  pre { background:#0e1622; color:#9fe870; font-size:14px; line-height:1.6; padding:14px; border-radius:10px; white-space:pre-wrap; word-break:break-word; min-height:60px; direction:ltr; text-align:left; }
  .lbl { font-size:15px; color:#5a6b7d; margin:14px 0 4px; }
</style>
</head>
<body>
<div class="card">
  <h1>اختبار اتصال الدخول — نسخة الكمبيوتر</h1>
  <p>الاختبار ده بيكلم خادم الدخول مباشرة من المتصفح ده وبيطبع الرد الحقيقي. اضغط الزر، واستنى لحد ما يخلص، وبعدين صوّر الشاشة وابعتها.</p>
  <button id="go">ابدأ الاختبار</button>
  <div class="lbl">معلومات الجهاز والمتصفح</div>
  <pre id="info">…</pre>
  <div class="lbl">نتيجة الاختبار</div>
  <pre id="out">لسه مبدأش</pre>
</div>
<script>
const info = document.getElementById('info');
const out = document.getElementById('out');
const lines = [];
function log(s){ lines.push(s); out.textContent = lines.join('\n'); }
(async () => {
  const sw = ('serviceWorker' in navigator) ? (navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : 'مسجّلة لكن غير مسيطرة على الصفحة دي') : 'غير مدعومة';
  let ver = '?';
  try { const r = await fetch('/app/version.json', {cache:'no-store'}); const j = await r.json(); ver = j.build; } catch(e) {}
  info.textContent = 'URL: ' + location.href + '\nBuild: ' + ver + '\nSW: ' + sw + '\nUA: ' + navigator.userAgent;
})();
document.getElementById('go').addEventListener('click', async () => {
  const btn = document.getElementById('go'); btn.disabled = true; lines.length = 0;
  log('بدأ: ' + new Date().toLocaleTimeString());
  try {
    const r = await fetch('/app/authfn/directory', {cache:'no-store'});
    const t = await r.text();
    log('1) GET directory -> ' + r.status);
    log('   ' + t.slice(0, 200));
  } catch(e) { log('1) GET directory -> فشل شبكة: ' + e.message); }
  try {
    const r = await fetch('/app/authfn/session', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({appUserId:'u-3', pin:'000000'})});
    const t = await r.text();
    log('2) POST session (رقم غلط مقصود) -> ' + r.status);
    log('   ' + t.slice(0, 200));
  } catch(e) { log('2) POST session -> فشل شبكة: ' + e.message); }
  log('خلص: ' + new Date().toLocaleTimeString() + ' — صوّر الشاشة دي وابعتها');
  btn.disabled = false;
});
</script>
</body>
</html>
